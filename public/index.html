<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Ferro — Registro de Treino</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header>
    <div>
      <div class="eyebrow">Registro pessoal de treino</div>
      <h1>Diário de Ferro</h1>
    </div>
    <div class="streak-block">
      <div>
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">dias seguidos</div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="hoje">Hoje</button>
    <button class="tab-btn" data-tab="historico">Histórico</button>
  </nav>

  <section id="hoje-view">

    <div class="day-nav">
      <button id="prevDay" aria-label="Dia anterior">←</button>
      <div class="day-info">
        <div class="day-date" id="dayDateLabel">—</div>
        <div class="day-type-badge" id="dayTypeBadge">—</div>
      </div>
      <button id="nextDay" aria-label="Próximo dia">→</button>
    </div>

    <div class="daytype-toggle">
      <button id="setHeavy">Pesado</button>
      <button id="setLight">Leve</button>
    </div>

    <button class="presence-btn" id="presenceBtn">Marcar presença de hoje</button>

    <div class="calendar" id="calendar"></div>
    <div class="cal-hint">Toque em um dia do calendário pra editar — inclusive dias passados</div>

    <div id="exerciseList"></div>
    <div class="save-flag" id="saveFlag"></div>

  </section>

  <section id="historico-view" hidden>
    <select class="hist-select" id="histSelect"></select>
    <div class="chart-wrap">
      <svg id="histChart" viewBox="0 0 600 200" style="width:100%;height:auto;display:block;"></svg>
    </div>
    <table class="hist-table" id="histTable"></table>
  </section>

  <div class="reset-link" id="resetLink">Apagar todos os dados salvos</div>

</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Exercício</div>
      <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
